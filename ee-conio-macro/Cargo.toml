[lib]
proc-macro=true

[package]
name = "ee-conio-macro"
version = "0.1.0-alpha.6"
description="ANSI escape sequence helpers (compile time)"
repository = "https://github.com/ErnieE5/ee-conio"
edition = "2024"
# Higher than the edition floor: rustc-literal-escaper 0.0.7 needs 1.89.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
keywords = ["ANSI", "terminal"]
categories = ["command-line-utilities"]
include = ["/src", "/tests", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
ee-conio-engine = { path="../ee-conio-engine", version="0.1.0-alpha.6" }
ee-conio-parse  = { path="../ee-conio-parse",  version="0.1.0-alpha.6" }
syn = "2.0"
proc-macro2 = "1.0.106"
rustc-literal-escaper = "0.0.7"


