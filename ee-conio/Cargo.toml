[package]
name = "ee-conio"
version = "0.1.0-alpha.6"
description="Readable mnemonics for ANSI escapes, expanded into string literals at compile time"
repository = "https://github.com/ErnieE5/ee-conio"
edition = "2024"
# Inherited from ee-conio-macro; see that manifest.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
keywords = ["ANSI", "terminal"]
categories = ["command-line-utilities"]
include = ["/src","/tests", "/examples","/LICENSE-MIT","/LICENSE-APACHE"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
ee-conio-engine = { path="../ee-conio-engine", version="0.1.0-alpha.6" }
ee-conio-macro  = { path="../ee-conio-macro",  version="0.1.0-alpha.6" }
embed-doc-image = "0.1.4"


[dev-dependencies]
ee-conio-parse = { path="../ee-conio-parse", version="0.1.0-alpha.6" }
enterpolation = "0.3.0"
ordered-float = "5.3.0"
palette = "0.7.6"


[package.metadata.docs.rs]
features = ["doc-images"]

[features]
doc-images = []
